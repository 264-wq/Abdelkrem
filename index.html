<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فني فك وتركيب مطابخ ونجار بالمدينة المنورة</title>
<meta name="description" content="فني فك وتركيب مطابخ ونجار بالمدينة المنورة: فك ونقل وتركيب المطابخ وأعمال النجارة">
<meta name="theme-color" content="#4a2c17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔨%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#faf6f1;--card:#fff;--tx:#2b1d14;--mu:#7a6555;--pr:#8a5a2b;--on:#fff;--bd:#eadfd2;--gd:#f2a93b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110c;--card:#241a12;--tx:#f3e9de;--mu:#c0a892;--pr:#e0a458;--on:#241505;--bd:#3d2e21}}
:root[data-theme="dark"]{--bg:#17110c;--card:#241a12;--tx:#f3e9de;--mu:#c0a892;--pr:#e0a458;--on:#241505;--bd:#3d2e21}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 'Segoe UI',Tahoma,Arial,sans-serif;padding-bottom:72px}
.w{max-width:900px;margin:auto;padding:0 16px}
header{color:#fff;padding:56px 0 44px;text-align:center;border-radius:0 0 32px 32px;background:radial-gradient(circle at 12% 25%,rgba(255,255,255,.16) 0 46px,transparent 47px),radial-gradient(circle at 88% 65%,rgba(255,255,255,.12) 0 80px,transparent 81px),radial-gradient(circle at 70% 15%,rgba(255,255,255,.1) 0 24px,transparent 25px),linear-gradient(160deg,#4a2c17,#8a5a2b)}
h1{margin:0 0 8px;font-size:32px}header p{margin:0 0 22px;opacity:.95}
.b{display:inline-block;padding:11px 22px;margin:4px;border-radius:26px;border:0;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;background:#fff;color:#4a2c17;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.b.gd{background:var(--gd);color:#2b1a00}.b.s{background:var(--pr);color:var(--on)}.b.w{background:#25d366;color:#053a1a}
.ch{margin-top:10px}.ch span{display:inline-block;margin:4px;padding:4px 14px;border-radius:16px;background:rgba(255,255,255,.18);font-size:14px}
section{padding:26px 0}h2{margin:0 0 18px;font-size:23px}h2::after{content:"";display:block;width:46px;height:4px;border-radius:4px;background:var(--gd);margin-top:6px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(138,90,43,.12)}
.c b{display:block;margin-bottom:4px}.c b::before{content:"✓";display:inline-grid;place-items:center;width:24px;height:24px;margin-inline-end:8px;border-radius:50%;background:var(--pr);color:var(--on);font-size:14px}
.c span{color:var(--mu);font-size:15px}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
footer{background:var(--card);border-top:1px solid var(--bd);padding:24px 0;text-align:center;color:var(--mu)}
.fl{color:var(--pr);text-decoration:none;font-weight:700}
.bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);z-index:4}
.bar .b{flex:1;text-align:center;margin:0}
#ed{background:var(--card);border-bottom:3px solid var(--pr);padding:14px 0}
#ed label{display:block;margin:10px 0 3px;font-weight:700;font-size:14px}
#ed input,#ed textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.th{position:relative}.th button{position:absolute;top:4px;left:4px;border:0;border-radius:50%;width:26px;height:26px;background:#d33;color:#fff;cursor:pointer}
#m{margin:8px 0;color:var(--pr);font-weight:700}
.mg{margin-top:6px;font-weight:700;color:var(--tx)}
</style></head><body>
<div id="app"></div><div id="edit"></div>
<script id="data" type="application/json">{"name": "فك وتركيب مطابخ ونجارة بالمدينة المنورة", "tag": "فني فك وتركيب مطابخ ونجار بالمدينة المنورة — تنفيذ متقن وأسعار مناسبة", "phone": "0542622084", "addr": "المدينة المنورة", "about": "نقدّم خدمات فني فك وتركيب مطابخ ونجار بالمدينة المنورة بخبرة ودقة في التنفيذ وأسعار مناسبة. تواصل معنا وسنكون عندك.", "services": [["فك وتركيب المطابخ", "فك ونقل وتركيب المطابخ بإتقان مع الحفاظ على القطع"], ["نجار بالمدينة المنورة", "أعمال النجارة للمنازل والمحلات"], ["فك وتركيب غرف النوم والدواليب", "فك ونقل وإعادة تركيب الأثاث الخشبي"], ["تركيب الأبواب والأرفف", "تركيب وضبط الأبواب والأرفف والوحدات"], ["صيانة وإصلاح الأثاث الخشبي", "إصلاح الأعطال والكسور وتجديد التركيب"]], "mgr": "إدارة أبو محمد", "photos": []}</script>
<script>
let D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function render(){
  const I=D.phone.replace(/\D/g,'').replace(/^(966)?0?/,'966');
  const a=$('#app');a.replaceChildren();
  const hd=el('header'),w=el('div','w');
  w.append(el('h1','',D.name),el('p','',D.tag));
  const lk=(x,h,c)=>{const e=el('a',c,x);e.href=h;e.target='_blank';e.rel='noopener';return e};
  w.append(lk('📞 اتصل الآن','tel:+'+I,'b gd'),lk('💬 واتساب','https://wa.me/'+I,'b'));
  const ch=el('div','ch');['✔ خبرة ودقة','✔ التزام بالمواعيد','✔ أسعار مناسبة'].forEach(x=>ch.append(el('span','',x)));w.append(ch);
  hd.append(w);a.append(hd);
  const m=el('div','w');
  let s=el('section');s.append(el('h2','','خدماتنا'));
  const g=el('div','g');D.services.forEach(x=>{const c=el('div','c');c.append(el('b','',x[0]),el('span','',x[1]||''));g.append(c)});
  s.append(g);m.append(s);
  if(D.photos.length){s=el('section');s.append(el('h2','','صور من أعمالنا'));const p=el('div','ph');
    D.photos.forEach(u=>{const i=el('img');i.src=u;i.alt='من أعمال '+D.name;i.loading='lazy';p.append(i)});s.append(p);m.append(s)}
  s=el('section');s.append(el('h2','','من نحن'),el('p','',D.about));m.append(s);
  a.append(m);
  const f=el('footer'),fw=el('div','w');
  fw.append(el('div','','📍 '+D.addr),lk('📞 '+D.phone,'tel:+'+I,'fl'),el('div','mg',D.mgr),el('div','','© '+D.name));f.append(fw);a.append(f);
  const bar=el('div','bar');bar.append(lk('📞 اتصل','tel:+'+I,'b s'),lk('💬 واتساب','https://wa.me/'+I,'b w'));a.append(bar);
}
render();
function img(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{
  const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.75))};i.src=r.result};r.readAsDataURL(file)})}
function editor(){
  const e=$('#edit');e.replaceChildren();
  const box=el('div');box.id='ed';const w=el('div','w');box.append(w);
  const F={};
  [['name','اسم الشركة'],['tag','الشعار / الوصف المختصر'],['phone','رقم الجوال (سعودي، مثل 05xxxxxxxx)'],['addr','العنوان'],['mgr','الإدارة']].forEach(([k,l])=>{
    w.append(el('label','',l));const i=el('input');i.value=D[k];F[k]=i;w.append(i)});
  w.append(el('label','','من نحن'));const ab=el('textarea');ab.rows=4;ab.value=D.about;w.append(ab);
  w.append(el('label','','الخدمات (كل خدمة في سطر: العنوان | الوصف)'));
  const sv=el('textarea');sv.rows=7;sv.value=D.services.map(x=>x[0]+' | '+(x[1]||'')).join('\n');w.append(sv);
  w.append(el('label','','الصور'));
  const ph=el('div','ph');
  const draw=()=>{ph.replaceChildren();D.photos.forEach((u,n)=>{const d=el('div','th'),i=el('img');i.src=u;const x=el('button','','×');
    x.onclick=()=>{D.photos.splice(n,1);draw()};d.append(i,x);ph.append(d)})};draw();w.append(ph);
  const up=el('input');up.type='file';up.accept='image/*';up.multiple=true;
  up.onchange=async()=>{msg('جاري تجهيز الصور...');for(const f of up.files){try{D.photos.push(await img(f))}catch(_){}}draw();msg('')};w.append(up);
  const m=el('div');m.id='m';w.append(m);
  const sb=el('button','b s','💾 حفظ ونشر');
  sb.onclick=async()=>{
    for(const k in F)D[k]=F[k].value.trim();D.about=ab.value.trim();
    D.services=sv.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|');return[p[0].trim(),(p[1]||'').trim()]});
    msg('جاري الحفظ...');
    try{const A=window.claude?await claude.use('artifact'):null;
      const c=document.documentElement.cloneNode(true);
      c.querySelector('#app').replaceChildren();c.querySelector('#edit').replaceChildren();
      c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
      const html='<!doctype html>\n'+c.outerHTML;if(A){await A.publish(html)}else{const a=el('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';document.body.append(a);a.click();a.remove();msg('تم تنزيل index.html — ارفعيه على GitHub بدل القديم')}}catch(er){msg('تعذّر الحفظ: '+(er&&er.code||''))}};
  const cb=el('button','b s','إغلاق');cb.onclick=()=>e.replaceChildren();
  w.append(sb,cb);e.append(box);
}
function msg(t){const m=$('#m');if(m)m.textContent=t}
function btn(e){const b=el('button','b s','✏️ تعديل الموقع');b.id='eb';b.onclick=editor;e.append(b)}
let sw=0,st=0,ty=0,lt=0;
const atB=()=>innerHeight+scrollY>=document.documentElement.scrollHeight-4;
const bump=()=>{const n=Date.now();if(n-lt<400)return;lt=n;if(n-st>6000)sw=0;st=n;if(++sw>=3){sw=0;gate()}};
addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(atB()&&ty-e.changedTouches[0].clientY>40)bump()},{passive:true});
addEventListener('wheel',e=>{if(atB()&&e.deltaY>0)bump()},{passive:true});
const H='db3883a10a6447a6f99d7144801c3b78be5a3df33d6c02851dcf56f5b6bea718';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function gate(){
  const e=$('#edit');e.replaceChildren();
  const box=el('div');box.id='ed';const w=el('div','w');box.append(w);
  w.append(el('label','','كلمة سر المدير'));
  const i=el('input');i.type='password';w.append(i);
  const m=el('div');m.id='m';w.append(m);
  const ok=el('button','b s','دخول');
  ok.onclick=async()=>{
    let h='';try{h=await sha(i.value)}catch(_){}
    if(h!==H){msg('كلمة السر غير صحيحة');return}
    let U=null;try{U=await claude.use('user')}catch(_){}
    if(!window.claude||(U&&U.canEdit&&U.canEdit()))editor();else msg('لازم تكوني داخلة بحساب Claude الخاص بالمدير عشان تحفظي التعديلات');
  };
  const cb=el('button','b s','إغلاق');cb.onclick=()=>e.replaceChildren();
  w.append(ok,cb);e.append(box);box.scrollIntoView();i.focus();
}
</script></body></html>
